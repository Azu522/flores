services:
  - type: web
    name: flores-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flores-db
          property: connectionString

databases:
  - name: flores-db
    plan: free
    databaseName: flores_db
    user: flores_user
    ipAllowList: []
